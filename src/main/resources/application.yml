# member-service 기본 설정 (뼈대). 실제 값은 환경 변수나 Kubernetes Secret으로 넣는다.
server:
  port: 8081

spring:
  application:
    name: member-service
  datasource:
    # 로컬: local-dev 레포의 Docker Compose MySQL / 운영: RDS freshlink-mysql
    url: ${DB_URL:jdbc:mysql://localhost:3306/member}
    username: ${DB_USERNAME:member_app}
    password: ${DB_PASSWORD:}
